name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build with Nuitka
        working-directory: src
        run: |
          nuitka --onefile --standalone `
            --assume-yes-for-downloads `
            --output-dir=..\dist `
            --output-filename=mibone.exe `
            mibone

      - name: Prepare release zip
        run: |
          $version = "${{ github.event.head_commit.message }}" -replace '^Release ', ''
          $dir = "mibone-$version"
          New-Item -ItemType Directory -Path $dir

          Copy-Item dist/mibone.exe $dir/
          Copy-Item config.template.yaml $dir/
          Copy-Item override.example.yaml $dir/
          Copy-Item subscriptions.example.yaml $dir/
          Copy-Item README.md $dir/
          Copy-Item LICENSE $dir/

          New-Item -ItemType Directory -Path "$dir/bin"
          Copy-Item bin/mihomo-service.xml "$dir/bin/"

          Compress-Archive -Path $dir -DestinationPath "mibone-$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.head_commit.message }}
          files: mibone-*.zip
          draft: false
          generate_release_notes: true
